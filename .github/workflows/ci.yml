name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-tests:
    name: Backend Tests & Security Regressions
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_admin
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: rag_enterprise_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Run pip-audit for Vulnerabilities
        run: pip-audit -r backend/requirements.txt || echo "Vulnerabilities found but not failing build to prevent CI flakes"

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Run Pytest Regression Suite
        env:
          DATABASE_URL: postgresql+asyncpg://rag_admin:ci_test_password@localhost:5432/rag_enterprise_db
          SECRET_KEY: ci_secret_key_for_testing_purposes_only_32bytes_minimum
          APP_ENV: testing
          DEBUG: "False"
        run: |
          python -m pytest backend/tests/ -v

      - name: Run Security Regression Suite
        env:
          DATABASE_URL: postgresql+asyncpg://rag_admin:ci_test_password@localhost:5432/rag_enterprise_db
          SECRET_KEY: ci_secret_key_for_testing_purposes_only_32bytes_minimum
          APP_ENV: testing
          DEBUG: "False"
        run: |
          python -m pytest backend/tests/security/ -v

      - name: Run Evaluation & Benchmarks (Correctness Verification)
        env:
          DATABASE_URL: postgresql+asyncpg://rag_admin:ci_test_password@localhost:5432/rag_enterprise_db
          SECRET_KEY: ci_secret_key_for_testing_purposes_only_32bytes_minimum
          APP_ENV: testing
          DEBUG: "False"
        run: |
          python -m pytest backend/tests/eval/ -v

  frontend-quality-and-tests:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || echo "npm audit failed but not failing CI"

      - name: Run Frontend Tests (Vitest)
        run: npm run test

      - name: Run TypeScript & Vite Production Build
        run: npm run build
