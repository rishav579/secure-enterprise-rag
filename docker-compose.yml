services:
  db:
    image: pgvector/pgvector:pg16
    container_name: secure_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-rag_enterprise_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_admin} -d ${POSTGRES_DB:-rag_enterprise_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: secure_rag_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_admin}:${POSTGRES_PASSWORD:-change_this_in_production}@db:5432/${POSTGRES_DB:-rag_enterprise_db}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-secure-random-secret-key-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-004}
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - rag_storage:/app/.local/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secure_rag_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  rag_storage:
    driver: local
